<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donkey Manor | The funniest house in town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:linear-gradient(180deg,#FFE45C 0%,#FFB62E 45%,#FF7A1F 80%,#E8451E 100%);
  --sunc:rgba(255,248,200,.95);
  --ink:#2B1005; --soft:#5E2E12; --accent:#FFC400;
  --panel:#FFF1A8; --panel-line:#2B1005; --chip:#FFF1A8; --pin-bg:#2B1005; --pin-fg:#FFD84A;
  --display:"Titan One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:linear-gradient(180deg,#240803 0%,#6B1C0A 50%,#C2410C 84%,#FF8A1F 100%);
    --sunc:rgba(255,226,170,.9);
    --ink:#FFE9B0; --soft:#E9C98A;
    --panel:#2B130A; --panel-line:#FFB62E; --chip:#2B130A; --pin-bg:#FFD84A; --pin-fg:#2B1005;
  }
}
:root[data-theme="dark"]{
  --sky:linear-gradient(180deg,#240803 0%,#6B1C0A 50%,#C2410C 84%,#FF8A1F 100%);
  --sunc:rgba(255,226,170,.9);
  --ink:#FFE9B0; --soft:#E9C98A;
  --panel:#2B130A; --panel-line:#FFB62E; --chip:#2B130A; --pin-bg:#FFD84A; --pin-fg:#2B1005;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#FFB62E;color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;background:var(--sky)}
.sun{position:fixed;width:min(46vw,300px);aspect-ratio:1;border-radius:50%;right:10%;top:12%;background:radial-gradient(circle,var(--sunc) 0 38%,transparent 70%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.12)}}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#c:active{cursor:grabbing}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}

header.bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.title h1{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1;margin:0;color:var(--ink);text-shadow:2px 2px 0 rgba(255,255,255,.35)}
.title p{margin:4px 0 0;font-weight:600;color:var(--soft);font-size:.95rem}
.tools{display:flex;gap:8px}
.tbtn{font:inherit;font-weight:800;font-size:.9rem;background:var(--chip);color:var(--ink);border:2px solid var(--panel-line);border-radius:999px;min-height:44px;min-width:44px;padding:0 14px;cursor:pointer}

.pins{position:fixed;inset:0;pointer-events:none;z-index:4}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-110%);background:var(--pin-bg);color:var(--pin-fg);border:0;border-radius:999px;padding:8px 14px;min-height:36px;font:800 .82rem var(--body);cursor:pointer;pointer-events:auto;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25);will-change:transform}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--pin-bg)}
.pin.off{visibility:hidden}
.pin i{position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--pin-bg);opacity:.0;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}

.hint{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:800;color:var(--ink);font-size:.95rem;pointer-events:none;z-index:3;transition:opacity .4s}
.hint.gone{opacity:0}
.chips{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px;overflow-x:auto;padding:4px 14px;scrollbar-width:none;transition:transform .3s,opacity .3s}
.chips::-webkit-scrollbar{display:none}
.chips .in{display:flex;gap:8px;margin:0 auto}
.chip{font:inherit;font-weight:800;font-size:.92rem;white-space:nowrap;background:var(--chip);color:var(--ink);border:2px solid var(--panel-line);border-radius:999px;min-height:46px;padding:0 16px;cursor:pointer;box-shadow:0 3px 0 var(--panel-line)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--panel-line)}
body.open .chips{opacity:0;pointer-events:none;transform:translateY(20px)}

/* Panel */
.panel{position:fixed;z-index:8;background:var(--panel);color:var(--ink);border:3px solid var(--panel-line);box-shadow:6px 6px 0 var(--panel-line);overflow:auto;visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.2,1),visibility 0s .4s}
.panel.open{visibility:visible;transform:none;transition:transform .4s cubic-bezier(.2,.9,.2,1),visibility 0s}
@media (max-width:899px){
  .panel{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:52vh;border-radius:22px;padding:22px 20px 22px;transform:translateY(115%)}
}
@media (min-width:900px){
  .panel{right:28px;top:104px;bottom:40px;width:400px;border-radius:24px;padding:28px 26px;transform:translateX(115%)}
}
.panel h2{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;margin:0 40px 8px 0}
.panel .intro{margin:0 0 16px;color:var(--soft);font-weight:600}
.close{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;border:2px solid var(--panel-line);background:transparent;color:var(--ink);font:800 1.4rem var(--body);cursor:pointer;line-height:1}
.btn{font:inherit;font-weight:800;background:var(--pin-bg);color:var(--pin-fg);border:0;border-radius:12px;padding:12px 20px;min-height:46px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--panel-line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.eyebrow{font-weight:800;font-size:.85rem;color:var(--soft);margin:0 0 6px}
.q{font-family:var(--display);font-size:1.3rem;line-height:1.25;margin:0 0 12px}
.a{font-size:1.2rem;font-weight:800;margin:0 0 6px;padding:12px 14px;background:rgba(255,196,0,.45);border-radius:12px;animation:pop .4s ease both}
.rim{font-weight:800;color:var(--soft);margin:0}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.facts{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.facts li{background:rgba(255,196,0,.35);border-radius:14px;padding:12px 14px}
.profile{margin:0 0 6px;display:grid;gap:8px}
.profile div{background:rgba(255,196,0,.35);border-radius:12px;padding:10px 14px}
.profile dt{font-weight:800;font-size:.82rem;color:var(--soft)}
.profile dd{margin:0;font-weight:600}
.chat{display:grid;gap:8px;margin-top:14px}
.chat p{margin:0;padding:9px 14px;border-radius:16px;max-width:85%;font-weight:700;animation:pop .35s ease both}
.chat .me{justify-self:end;background:var(--pin-bg);color:var(--pin-fg);border-bottom-right-radius:4px}
.chat .him{justify-self:start;background:rgba(255,196,0,.6);border-bottom-left-radius:4px}
details{background:rgba(255,196,0,.35);border-radius:14px;padding:4px 14px;margin-bottom:10px}
summary{cursor:pointer;font-weight:800;padding:10px 0;min-height:44px}
details p{margin:0 0 12px;font-weight:600}
.big{font-family:var(--display);font-size:3rem;line-height:1;margin:6px 0 4px}

.bubble{position:fixed;z-index:6;left:0;top:0;pointer-events:none;background:#FFF7C4;color:#2B1005;font-family:var(--display);font-size:1.3rem;padding:8px 16px;border:3px solid #2B1005;border-radius:18px 18px 18px 4px;opacity:0;transform:translate(-30%,-100%) scale(.5)}
.bubble.show{opacity:1;transform:translate(-30%,-100%) scale(1);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}

.loader{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--sky);font-family:var(--display);font-size:1.6rem;color:var(--ink);transition:opacity .6s}
.loader.done{opacity:0;pointer-events:none}
.fallback{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;z-index:30;background:var(--sky);font-weight:800}
.fallback[hidden]{display:none}

header.bar{flex-wrap:wrap;gap:8px}
.tbtn.go{background:var(--pin-bg);color:var(--pin-fg);border-color:var(--pin-bg)}
.fade{position:fixed;inset:0;background:#120703;opacity:0;pointer-events:none;z-index:15;transition:opacity .5s}
.fade.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--panel);color:var(--ink);border:3px solid var(--panel-line);border-radius:16px;padding:12px 18px;font-weight:800;z-index:12;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100vw - 32px);text-align:center;box-shadow:4px 4px 0 var(--panel-line)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.chips-in{display:none}
body.inside .chips-in{display:flex}
body.inside .chips-out{display:none}
body.inside .pins{display:none}
body.inside .sun{display:none}
@media (max-width:560px){.title p{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="sun" aria-hidden="true"></div>
<canvas id="c" aria-label="A 3D yellow house. Drag to rotate it and tap a part to open it."></canvas>
<div class="pins" id="pins"></div>
<div class="bubble" id="bubble" aria-hidden="true">Hee-haw!</div>

<header class="bar">
  <div class="title"><h1>Donkey Manor</h1><p>Home of Dinku, the funniest donkey in town</p></div>
  <div class="tools">
    <button class="tbtn go" id="enter" type="button">Go inside</button>
    <button class="tbtn" id="reset" type="button">Reset</button>
    <button class="tbtn" id="theme" type="button" aria-label="Switch day and night">&#9681;</button>
  </div>
</header>

<p class="hint" id="hint">Drag to spin the house. Tap a part to open it.</p>
<nav class="chips chips-out" aria-label="Parts of the house"><div class="in" id="chips"></div></nav>
<nav class="chips chips-in" aria-label="Rooms inside the house"><div class="in" id="chipsIn"></div></nav>

<aside class="panel" id="panel" role="dialog" aria-labelledby="pt" aria-modal="false">
  <button class="close" id="close" type="button" aria-label="Close">&times;</button>
  <h2 id="pt" tabindex="-1"></h2>
  <div id="pb"></div>
</aside>

<div class="loader" id="loader">Building the house&hellip;</div>
<div class="fade" id="fade" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="fallback" id="fallback" hidden><p>This page needs 3D graphics (WebGL), which your browser or device did not start. Try another browser.</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var fb=document.getElementById('fallback');
  if(typeof THREE==='undefined'){fb.hidden=false;return;}
  var root=document.documentElement;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas=document.getElementById('c');
  var renderer;
  try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});}
  catch(e){fb.hidden=false;return;}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(40,1,.1,120);
  var W=1,H=1;

  /* ---------- helpers ---------- */
  var parts={};
  function M(hex,o){return new THREE.MeshStandardMaterial(Object.assign({color:hex,roughness:.85,metalness:0},o||{}));}
  function box(w,h,d,mat,x,y,z,parent){
    var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
    if(parent)parent.add(m);return m;
  }
  function ball(r,mat,x,y,z,parent){
    var m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat);
    m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
    if(parent)parent.add(m);return m;
  }
  function tag(obj,sec){
    obj.traverse(function(o){
      if(o.isMesh){o.userData.section=sec;(parts[sec]=parts[sec]||[]).push(o);}
    });
  }

  /* ---------- lights ---------- */
  var hemi=new THREE.HemisphereLight(0xFFE6A0,0xE8501E,.8);scene.add(hemi);
  var sun=new THREE.DirectionalLight(0xFFE9B0,1.15);
  sun.position.set(6,11,7);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;
  sun.shadow.camera.near=1;sun.shadow.camera.far=30;
  scene.add(sun);

  /* ---------- ground ---------- */
  var ground=new THREE.Mesh(new THREE.CylinderGeometry(8.5,8.5,.4,64),M(0xE0561C));
  ground.position.y=-.2;ground.receiveShadow=true;scene.add(ground);
  var rim=new THREE.Mesh(new THREE.TorusGeometry(8.5,.09,8,64),M(0xFFC400));
  rim.rotation.x=Math.PI/2;rim.position.y=.0;scene.add(rim);
  box(1.1,.04,4.2,M(0xFFE27A),0,.02,4.1,scene);

  /* ---------- house ---------- */
  var house=new THREE.Group();scene.add(house);
  var wall=M(0xFFC400,{roughness:.7});
  box(4,2.6,3.4,wall,0,1.3,0,house);
  box(4.25,.22,3.65,M(0x8B2E0F),0,.11,0,house);

  // roof group: panels, ridge, gable ends, attic window
  var roofG=new THREE.Group();house.add(roofG);
  var shp=new THREE.Shape();shp.moveTo(-2,0);shp.lineTo(2,0);shp.lineTo(0,1.6);shp.lineTo(-2,0);
  var gg=new THREE.ExtrudeGeometry(shp,{depth:3.4,bevelEnabled:false});gg.translate(0,0,-1.7);
  var gable=new THREE.Mesh(gg,wall);gable.position.y=2.6;gable.castShadow=true;gable.receiveShadow=true;roofG.add(gable);
  var ang=Math.atan2(1.6,2);
  var rmat=M(0xE8501E,{roughness:.7});
  var rp1=box(2.75,.18,3.9,rmat,1.06,3.48,0,roofG);rp1.rotation.z=-ang;
  var rp2=box(2.75,.18,3.9,rmat,-1.06,3.48,0,roofG);rp2.rotation.z=ang;
  box(.34,.16,3.92,M(0xB8260F),0,4.24,0,roofG);
  var glassMats=[];
  function glassMat(){var m=M(0xFFF1B8,{emissive:0xFFE08A,emissiveIntensity:.5,roughness:.3});glassMats.push(m);return m;}
  var attic=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.1,24),glassMat());
  attic.rotation.x=Math.PI/2;attic.position.set(0,3.25,1.72);roofG.add(attic);
  var atticRing=new THREE.Mesh(new THREE.TorusGeometry(.32,.05,8,24),M(0x8B2E0F));
  atticRing.position.set(0,3.25,1.74);roofG.add(atticRing);
  tag(roofG,'roof');
  attic.userData.glass=true;

  // door
  var doorG=new THREE.Group();house.add(doorG);
  box(.92,1.64,.04,M(0x140803,{roughness:1}),0,.82,1.69,doorG);
  box(1.12,.12,.16,M(0x3A1A0A),0,1.7,1.72,doorG);
  box(.1,1.7,.16,M(0x3A1A0A),-.52,.85,1.72,doorG);
  box(.1,1.7,.16,M(0x3A1A0A),.52,.85,1.72,doorG);
  box(1.5,.12,.7,M(0x8B2E0F),0,.06,2.05,doorG);
  var eyes=new THREE.Group();eyes.position.set(0,1.05,1.72);doorG.add(eyes);
  [-.17,.17].forEach(function(x){
    ball(.1,M(0xFFFFFF,{emissive:0xFFFFFF,emissiveIntensity:.4}),x,0,0,eyes);
    ball(.045,M(0x000000),x+(x<0?.02:-.02),-.01,.08,eyes);
  });
  var brow=box(.2,.04,.04,M(0x3A1A0A),.17,.16,.04,eyes);brow.rotation.z=.35;
  eyes.scale.setScalar(.001);
  var doorPivot=new THREE.Group();doorPivot.position.set(-.45,0,1.74);doorG.add(doorPivot);
  box(.9,1.6,.09,M(0xA3200E,{roughness:.6}),.45,.8,0,doorPivot);
  box(.62,.5,.1,M(0xC72B12),.45,1.1,.01,doorPivot);
  box(.62,.5,.1,M(0xC72B12),.45,.45,.01,doorPivot);
  ball(.06,M(0xFFD84A,{metalness:.6,roughness:.3}),.78,.8,.08,doorPivot);
  tag(doorG,'door');

  // windows
  function makeWindow(x,y,z,ry){
    var g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;
    box(.98,.98,.12,M(0x8B2E0F),0,0,0,g);
    var gl=box(.76,.76,.14,glassMat(),0,0,.01,g);gl.userData.glass=true;
    box(.78,.06,.17,M(0x8B2E0F),0,0,.01,g);
    box(.06,.78,.17,M(0x8B2E0F),0,0,.01,g);
    box(1.15,.09,.26,M(0x8B2E0F),0,-.54,.1,g);
    house.add(g);tag(g,'windows');
    g.traverse(function(o){if(o.isMesh&&o.material&&glassMats.indexOf(o.material)>-1)o.userData.glass=true;});
    return g;
  }
  makeWindow(1.3,1.7,1.7,0);
  makeWindow(-1.3,1.7,1.7,0);
  makeWindow(2,1.7,0,Math.PI/2);
  makeWindow(-2,1.7,0,-Math.PI/2);

  // chimney
  var chim=new THREE.Group();house.add(chim);
  box(.6,1.6,.6,M(0xC8421A),1.2,3.7,-.6,chim);
  box(.8,.15,.8,M(0x5A1A08),1.2,4.55,-.6,chim);
  box(.62,.06,.62,M(0xFFC400),1.2,3.95,-.6,chim);
  tag(chim,'chimney');

  // smoke
  var smoke=[];
  for(var i=0;i<8;i++){
    var sm=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),new THREE.MeshBasicMaterial({color:0xFFE2B8,transparent:true,opacity:.6,depthWrite:false}));
    sm.raycast=function(){};scene.add(sm);smoke.push({m:sm,off:i/8});
  }
  var smokeBoost=0;

  /* ---------- garden ---------- */
  function bush(x,z,r,c){var b=ball(r,M(c,{roughness:1}),x,r*.8,z,scene);return b;}
  bush(-2.5,2.15,.5,0xFFB000);bush(-2.9,1.6,.38,0xE8751E);bush(2.55,2.1,.48,0xE8751E);bush(2.95,1.6,.36,0xFFB000);
  bush(-2.4,-2.1,.55,0xFFB000);bush(2.3,-2.3,.45,0xFFB000);
  var tree=new THREE.Group();tree.position.set(-5,0,-1.8);scene.add(tree);
  var tr=new THREE.Mesh(new THREE.CylinderGeometry(.18,.26,1.8,10),M(0x5A2D0C));tr.position.y=.9;tr.castShadow=true;tree.add(tr);
  ball(1.05,M(0xFFB000,{roughness:1}),0,2.3,0,tree);
  ball(.8,M(0xFF8A1F,{roughness:1}),.6,2.9,.3,tree);
  ball(.7,M(0xE8501E,{roughness:1}),-.5,2.8,-.2,tree);

  // mailbox
  var mail=new THREE.Group();mail.position.set(3.3,0,2.6);mail.rotation.y=-.4;scene.add(mail);
  box(.12,1,.12,M(0x5A2D0C),0,.5,0,mail);
  box(.72,.42,.46,M(0xD6452F),0,1.2,0,mail);
  var mtop=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.72,16),M(0xD6452F));
  mtop.rotation.z=Math.PI/2;mtop.position.set(0,1.38,0);mtop.castShadow=true;mail.add(mtop);
  box(.05,.38,.05,M(0xFFC400),.42,1.35,0,mail);
  box(.22,.12,.05,M(0xFFC400),.5,1.55,0,mail);
  tag(mail,'mailbox');

  /* ---------- donkey ---------- */
  function buildDonkey(px,pz,ry,sec,parent){
    var g=new THREE.Group();
    var body=M(0x8A7560),dark=M(0x5E4C3B),light=M(0xCDBA9C),mane=M(0x2B1608);
    [[.55,.22],[.55,-.22],[-.55,.22],[-.55,-.22]].forEach(function(p){
      box(.17,.75,.17,dark,p[0],.375,p[1],g);
      box(.2,.1,.2,M(0x241309),p[0],.05,p[1],g);
    });

    }
    if(yawG!==null){
      var dy=yawG-ip.yaw;dy=((dy+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
      ip.yaw+=dy*Math.min(1,dt*(reduce?40:3));
      if(Math.abs(dy)<.01)yawG=null;
    }
    if(pitchG!==null){
      var dp=pitchG-ip.pitch;ip.pitch+=dp*Math.min(1,dt*(reduce?40:3));
      if(Math.abs(dp)<.01)pitchG=null;
    }
    ip.x=clamp(ip.x,-4.5,4.5);ip.z=clamp(ip.z,-3.4,3.6);
    bob=(mv&&!reduce)?Math.sin(t*9)*.03:bob*.8;

    // fire
    if(!reduce){
      for(var i=0;i<flames.length;i++){
        var fl=flames[i],s=1+Math.sin(t*(7+i*2)+i)*.18+Math.sin(t*13+i*3)*.08;
        fl.scale.set(1+Math.sin(t*5+i)*.08,s,1+Math.cos(t*6+i)*.08);
        fl.position.y=fl.userData.by+(s-1)*.2;
      }
      for(var c=0;c<candleF.length;c++){var cs=1+Math.sin(t*14+c*2)*.25;candleF[c].scale.set(cs,cs*1.3,cs);}
      for(var q=0;q<fairy.length;q++){var fs=1+Math.sin(t*3+q*1.3)*.5;fairy[q].scale.setScalar(fs);}
    }
    fireL.intensity=(1.2+(reduce?0:Math.sin(t*11)*.15+Math.sin(t*23)*.1))*ptScale;
    // TV
    var tf=Math.floor(t*15);
    if(tf!==tvLast&&!reduce){tvLast=tf;drawTV(t);}
    // clock
    var now=new Date(),sec=now.getSeconds()+now.getMilliseconds()/1000,mn=now.getMinutes()+sec/60,hr=(now.getHours()%12)+mn/60;
    hands.s.rotation.z=sec/60*Math.PI*2;hands.m.rotation.z=mn/60*Math.PI*2;hands.h.rotation.z=hr/12*Math.PI*2;
  }


  /* ---------- loop ---------- */
  var clock=new THREE.Clock(),first=true;
  function pulse(t,period,dur){var f=(t%period)/period;var d=dur/period;return f<d?Math.sin(f/d*Math.PI):0;}
  var headV=new THREE.Vector3();
  function tick(){
    var dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
    // camera
    if(mode==='inside'){updateInside(dt,t);}
    else{
      if(flying&&goal){
        var k=Math.min(1,dt*3.2);
        cam.theta+=(goal.theta-cam.theta)*k;cam.phi+=(goal.phi-cam.phi)*k;cam.r+=(goal.r-cam.r)*k;
        cam.lx+=(goal.lx-cam.lx)*k;cam.ly+=(goal.ly-cam.ly)*k;cam.lz+=(goal.lz-cam.lz)*k;
        if(Math.abs(goal.theta-cam.theta)+Math.abs(goal.phi-cam.phi)+Math.abs(goal.r-cam.r)<.01)flying=false;
      }else if(!Object.keys(pointers).length){
        cam.theta+=vTheta;vTheta*=.92;
        if(!panelOpen&&!reduce&&performance.now()-lastInteract>3500)cam.theta+=dt*.12;
      }
    }
    var vk=Math.min(1,dt*4);
    viewOff.x+=(viewGoal.x-viewOff.x)*vk;viewOff.y+=(viewGoal.y-viewOff.y)*vk;
    placeCamera();

    // door and eyes
    doorPivot.rotation.y+=(doorGoal-doorPivot.rotation.y)*Math.min(1,dt*5);
    var es=eyes.scale.x+(eyeGoal-eyes.scale.x)*Math.min(1,dt*6);eyes.scale.setScalar(Math.max(.001,es));
    eyes.visible=doorPivot.rotation.y<-.6;

    // windows flicker
    for(var i=0;i<glassMats.length;i++){
      glassMats[i].emissiveIntensity=glowBase+Math.sin(t*2+i*1.7)*.08;
    }

    // donkeys
    animDonkey(D,t,dt);if(mode==='inside')animDonkey(DI,t,dt);
    if(bubble.classList.contains('show')){
      var bo=bubbleOwner||D;
      bo.head.getWorldPosition(headV);headV.y+=.8;headV.project(camera);
      bubble.style.left=((headV.x*.5+.5)*W)+'px';bubble.style.top=((-headV.y*.5+.5)*H)+'px';
    }

    // smoke
    smokeBoost=Math.max(0,smokeBoost-dt*.4);
    for(var s=0;s<smoke.length;s++){
      var q=smoke[s],ph=reduce?q.off:((t*(.18+smokeBoost*.25)+q.off)%1);
      var sc=.5+ph*(1.6+smokeBoost*.8);
      q.m.position.set(1.2+Math.sin(ph*6+s)*.25+ph*.9,4.7+ph*(2.6+smokeBoost*1.2),-.6+Math.cos(ph*5+s)*.15);
      q.m.scale.setScalar(sc);
      q.m.material.opacity=(1-ph)*(.55+smokeBoost*.25);
    }

    // embers
    if(!reduce){
      for(var e2=0;e2<EN;e2++){
        ePos[e2*3+1]+=eSpd[e2]*dt;ePos[e2*3]+=Math.sin(t+e2)*dt*.15;
        if(ePos[e2*3+1]>8){ePos[e2*3+1]=0;ePos[e2*3]=(Math.random()-.5)*18;ePos[e2*3+2]=(Math.random()-.5)*18;}
      }
      eGeo.attributes.position.needsUpdate=true;
    }

    if(mode==='outside')updatePins();
    renderer.render(scene,camera);
    if(first){first=false;document.getElementById('loader').classList.add('done');}
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize',resize);
  applyTheme();resize();
  document.getElementById('hint').textContent='Drag to spin the house. Tap a part, or tap the donkey.';
  requestAnimationFrame(tick);
})();
</script>
</body>
